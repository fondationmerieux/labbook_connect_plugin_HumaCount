# Analyzer Configuration File
# General settings and connection details for one HUMAN HumaCount 5D analyzer.
# This is a sample file.
# The operator MUST edit this file and set real network values before use.

version = "1.0.1"  # Configuration file version

[analyzer]
brand = "HUMAN"                               # Analyzer brand
name = "HumaCount5D"                          # Analyzer model name
id = "HC5D_01"                                # Unique analyzer identifier (same value in LabBook)
plugin = "AnalyzerHumaCount5D"                # Plugin Java class name for this analyzer
url_lis = "http://localhost/sigl"             # LIS upstream endpoint
operation_mode = "query"                      # Informative only, set the Mode in the LabBook analyzer record
archive_msg = "Y"                             # Enable ('Y') or disable ('N') message archiving
type_cnx = "socket"                           # Connection type (TCP socket, MLLP framing)
type_msg = "HL7"                              # Message type (HL7 or ASTM)
mapping = "/storage/resource/connect/analyzer/mapping/mapping_humacount5d.toml"  # Mapping file path

[analyzer.socket]
mode = "server"                               # server: the analyzer connects to LabBook Connect
ip = "IP_ADDRESS_TO_ENTER"                    # Analyzer IP address
port = 7501                                   # Example value - allowed ranges: 7500-7599, 12300-12399
