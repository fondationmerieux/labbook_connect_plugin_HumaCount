# ============================================================
# LabBook Connect — Mapping HumaCount 5D
# Analyseur : HUMAN HumaCount 5D (hématologie 5-parts diff)
# Protocole : HL7 v2.3.1 / TCP-IP / MLLP
# Version   : 4.0.0  (ALIGNE SUR L'ANALYSE EXISTANTE « NFS - Hematologia »)
# Date      : 2026-09-11
# ============================================================
#
# CHANGEMENT PAR RAPPORT A LA v3.x
# --------------------------------
# La v3.x pointait vers une analyse autonome NFS_HC5 et des variables HC_*
# qui n'ont jamais ete creees dans le referentiel (requete SQL : Empty set).
# Consequence : les 29 valeurs arrivaient bien dans analyzer_result avec
# anr_lb_code = "HC_xxx", mais aucun champ de saisie ne porte ce code,
# donc aucun pre-remplissage a l'ecran.
#
# Cette v4.0 mappe directement sur l'analyse deja utilisee au laboratoire :
#   sigl_05_data : id = 555, code = B1030, libelle « NFS - Hematologia »
#   33 variables, codes NFS_*
# Aucune creation SQL n'est necessaire. Aucune modification du jar non plus.
#
# vendor_result_code : OBX-3.1 envoye par l'automate (code LOINC ou 99MRC)
# lis_result_code    : sigl_07_data.code_var de l'analyse B1030
# lis_unit           : unite a transmettre (remplace OBX-6 si defini)
#                      absent / commente = OBX-6 conserve tel quel
#
# test : OBR-4.1 identifiant le type de resultat
#   01001 = Automated Count (NFS automate — 29 parametres)  <- releve sur message reel
#   01002 = Manual Count    (NFS manuelle — non mappe ici)
#
# COUVERTURE
# ----------
#   28 parametres automate mappes sur 28 des 33 variables de B1030
#   1 parametre automate NON mappe   : PDW (32207-3) — pas de variable dans B1030
#   5 variables B1030 NON alimentees : NFS_MI#, NFS_MI%, NFS_GR#, NFS_GR%
#                                      (diff 3-parts, l'automate est 5-parts)
#                                      et NFS_HGB_1 (doublon d'hemoglobine)
# ============================================================

# ------------------------------------------------------------
# Analyse — alimente OBR-4 du message OUL^R22 envoye au LIS
# ------------------------------------------------------------
